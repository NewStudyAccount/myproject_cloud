server:
  port: 9203

spring:
  application:
    name: cloud-file
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: ''
        group: DEFAULT_GROUP
      config:
        server-addr: 127.0.0.1:8848
        namespace: ''
        group: DEFAULT_GROUP
        file-extension: yml

  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/project_cloud?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=Asia/Shanghai
    username: root
    password: root123
    druid:
      initial-size: 5
      min-idle: 10
      max-active: 20
      max-wait: 60000

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.project.cloud.file.domain.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 文件存储配置
file:
  storage:
    # 默认存储类型
    default-type: minio
    # MinIO 配置
    minio:
      endpoint: http://127.0.0.1:9000
      access-key: minioadmin
      secret-key: minioadmin
      bucket-name: project-cloud
    # 阿里云 OSS 配置
    oss:
      endpoint: oss-cn-hangzhou.aliyuncs.com
      access-key: your-access-key
      secret-key: your-secret-key
      bucket-name: your-bucket
    # 腾讯云 COS 配置
    cos:
      region: ap-guangzhou
      secret-id: your-secret-id
      secret-key: your-secret-key
      bucket-name: your-bucket

management:
  endpoints:
    web:
      exposure:
        include: '*'
