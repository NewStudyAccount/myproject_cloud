server:
  port: 8080

spring:
  application:
    name: cloud-gateway
  cloud:
    gateway:
      routes:
        - id: cloud-auth
          uri: lb://cloud-auth
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1
        - id: cloud-system
          uri: lb://cloud-system
          predicates:
            - Path=/system/**
          filters:
            - StripPrefix=1
        - id: cloud-generator
          uri: lb://cloud-generator
          predicates:
            - Path=/generator/**
          filters:
            - StripPrefix=1
        - id: cloud-file
          uri: lb://cloud-file
          predicates:
            - Path=/file/**
          filters:
            - StripPrefix=1
